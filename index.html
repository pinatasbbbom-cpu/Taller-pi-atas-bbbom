async function sync(){if(!CFG.url||busy||!navigator.onLine)return;busy=true;
 try{if(!await ensure()){setSyn(ld(LA,null)?'Sin conexión: se sincronizará luego':'Inicia sesión');return}

  const last=ld(LL,'1970-01-01T00:00:00Z');
  const r=await fetch(CFG.url+'/rest/v1/bbbom?updated_at=gte.'+encodeURIComponent(last)+'&order=updated_at.asc&limit=1000',{headers:H()});
  if(!r.ok)throw new Error('pull');const rows=await r.json();
  if(rows.length){rows.forEach(w=>{if(w.t=='s'){if(!w.deleted)S.s=w.data;return}const a=S[w.t];if(!a)return;const id=w.id.slice(w.t.length+1),i=a.findIndex(x=>x.id==id);
   if(i>=0){w.deleted?a.splice(i,1):a[i]=w.data}else if(!w.deleted)a.push(w.data)});

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $$=n=>'$'+Number(n||0).toLocaleString('es',{maximumFractionDigits:2}),sum=a=>a.reduce((x,y)=>x+y,0),avg=a=>a.length?sum(a)/a.length:0;

function form(title,fields,vals,onSave,onDel){
 const M=$('#M');let rec=(vals.r||[]).map(r=>({...r}));let ext=(vals.x||[]).map(x=>({...x}));
 let h='<h3>'+title+'</h3>';
 fields.forEach(f=>{const v=vals[f.k]??'';
  if(f.t=='sel')h+=`<label>${f.l}<select id="f_${f.k}">${f.o.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select></label>`;
  else if(f.t=='img')h+='<label>Foto de la piñata (opcional)</label><div id="im" style="margin:6px 0"></div><input type="file" id="imf" accept="image/*" style="padding:6px"><button type="button" class="b2 bs" id="imx" style="margin-top:6px">Quitar foto</button>';
  else if(f.t=='ext')h+='<label>'+f.l+'</label><div id="ext"></div><button type="button" class="b2 bs" id="addx">+ Costo</button>';
  else if(f.t=='ta')h+=`<label>${f.l}<textarea id="f_${f.k}" rows="3">${esc(v)}</textarea></label>`;
  else if(f.t=='rec')h+=`<label>${f.l}</label><div id="rec"></div><button type="button" class="b2 bs" id="addr">+ Material</button>`;
  else h+=`<label>${f.l}<input id="f_${f.k}" type="${f.t||'text'}" ${f.t=='number'?'step="any" inputmode="decimal"':''} value="${esc(v)}"></label>`});
 h+=`<div class="row"><button class="b2" id="cx">Cancelar</button>${onDel?'<button class="bd" id="dl">Eliminar</button>':''}<button id="ok">Guardar</button></div>`;
 M.innerHTML='<div class="sh">'+h+'</div>';M.style.display='flex';
 const sync=()=>{rec=[...document.querySelectorAll('.rr')].map(r=>({m:r.querySelector('select').value,q:parseFloat(r.querySelector('input').value)||0}))};
 const draw=()=>{const e=$('#rec');if(!e)return;e.innerHTML=rec.map((r,i)=>`<div class="row rr" style="margin-top:6px"><select>${S.m.map(m=>`<option value="${m.id}" ${m.id==r.m?'selected':''}>${esc(m.n)} (${esc(m.u)})</option>`).join('')}</select><input type="number" step="any" inputmode="decimal" value="${r.q}" style="width:80px"><button type="button" class="bd bs" data-i="${i}">✕</button></div>`).join('');
  e.querySelectorAll('button').forEach(b=>b.onclick=()=>{sync();rec.splice(+b.dataset.i,1);draw()})};
 draw();if($('#addr'))$('#addr').onclick=()=>{sync();if(S.m.length)rec.push({m:S.m[0].id,q:1});draw()};
 const syncX=()=>{ext=[...document.querySelectorAll('.xr')].map(r=>({n:r.querySelector('.xn').value,v:parseFloat(r.querySelector('.xv').value)||0}))};
 const drawX=()=>{const e=$('#ext');if(!e)return;e.innerHTML=ext.map((x,i)=>`<div class="row xr" style="margin-top:6px"><input class="xn" value="${esc(x.n)}" placeholder="Concepto"><input class="xv" type="number" step="any" inputmode="decimal" value="${x.v}" style="width:100px"><button type="button" class="bd bs" data-i="${i}">✕</button></div>`).join('');e.querySelectorAll('button').forEach(b=>b.onclick=()=>{syncX();ext.splice(+b.dataset.i,1);drawX()})};
 drawX();if($('#addx'))$('#addx').onclick=()=>{syncX();ext.push({n:'',v:0});drawX()};
 let img=vals.img||'';const showI=()=>{const e=$('#im');if(e)e.innerHTML=img?'<img src="'+img+'" style="width:100%;max-height:200px;object-fit:cover;border-radius:10px">':'<div class="mu">Sin foto</div>'};
 if($('#imf')){showI();$('#imf').onchange=async e=>{const f=e.target.files[0];if(f){img=await shrink(f);showI()}};$('#imx').onclick=()=>{img='';showI()}}
 $('#cx').onclick=()=>M.style.display='none';
 if(onDel)$('#dl').onclick=()=>{if(confirm('¿Eliminar?')){onDel();M.style.display='none';save();render()}};
 $('#ok').onclick=()=>{if($('#rec'))sync();if($('#ext'))syncX();const o={};
  fields.forEach(f=>{if(f.t=='rec')o.r=rec;else if(f.t=='img')o.img=img;else if(f.t=='ext')o.x=ext;else{const v=$('#f_'+f.k).value;o[f.k]=f.t=='number'?(parseFloat(v)||0):v.trim()}});

}

async function shrink(f){const b=await createImageBitmap(f),k=Math.min(1,480/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.72)}
/* ---------- acciones ---------- */
const PF=[{k:'n',l:'Nombre'},{k:'img',t:'img'},{k:'sz',l:'Tamaño',t:'sel',o:SZ},{k:'mt',l:'Material principal'},{k:'t',l:'Minutos que tardas en hacerla',t:'number'},{k:'pr',l:'Precio de venta',t:'number'},{k:'st',l:'Existencia',t:'number'},{k:'r',l:'Materiales que usa',t:'rec'},{k:'x',l:'Otros costos (impresión, acabados, energía…)',t:'ext'},{k:'dz',l:'Despiece y medidas (notas)',t:'ta'},{k:'mg',l:'Margen de ganancia % (0 = usar el general)',t:'number'}];
function addP(){form('Nueva piñata',PF,{sz:'Mediana',r:[]},o=>S.p.push({id:uid(),...o}))}
function edP(id){const p=pro(id);form('Editar piñata',PF,p,o=>Object.assign(p,o),()=>S.p=S.p.filter(x=>x.id!=id))}
function mkP(id){const p=pro(id);form('Producir: '+esc(p.n),[{k:'q',l:'¿Cuántas hiciste?',t:'number'}],{q:1},o=>{p.st+=o.q;p.r.forEach(r=>{const m=mat(r.m);if(m)m.st=Math.max(0,m.st-r.q*o.q)})})}
const MF=[{k:'n',l:'Material'},{k:'u',l:'Unidad (pliego, litro, pieza…)'},{k:'c',l:'Costo por unidad',t:'number'},{k:'st',l:'Existencia',t:'number'},{k:'mn',l:'Avisar cuando quede menos de',t:'number'}];
function addM(){form('Nuevo material',MF,{},o=>S.m.push({id:uid(),...o}))}
function edM(id){const m=mat(id);form('Editar material',MF,m,o=>Object.assign(m,o),()=>S.m=S.m.filter(x=>x.id!=id))}
function rpM(id){const m=mat(id);form('Reponer: '+esc(m.n),[{k:'q',l:'Cantidad que compraste ('+esc(m.u)+')',t:'number'},{k:'c',l:'Costo por unidad de esta compra',t:'number'}],{q:0,c:m.c},o=>{if(o.q>0){m.st+=o.q;if(o.c>0)m.c=o.c}})}
const FF=[{k:'n',l:'Concepto'},{k:'ty',l:'Tipo',t:'sel',o:['Fijo','Operativo']},{k:'v',l:'Monto mensual',t:'number'}];
function addF(){form('Nuevo costo mensual',FF,{ty:'Fijo'},o=>S.f.push({id:uid(),...o}))}
function edF(id){const f=S.f.find(x=>x.id==id);form('Editar costo',FF,f,o=>Object.assign(f,o),()=>S.f=S.f.filter(x=>x.id!=id))}
function cfg(){form('Configuración',[{k:'h',l:'Valor de tu hora de trabajo',t:'number'},{k:'mg',l:'Margen de ganancia objetivo (%)',t:'number'}],S.s,o=>S.s=o)}
function add(id){const p=pro(id);C[id]=(C[id]||0)+1;render()}
function sub(id){C[id]--;if(C[id]<=0)delete C[id];render()}
function pay(){const it=Object.keys(C).map(id=>{const p=pro(id);return{p:id,n:p.n,q:C[id],pr:p.pr,c:cost(p)}});if(!it.length)return;
 S.v.push({id:uid(),d:now(),i:it,tot:sum(it.map(i=>i.q*i.pr))});it.forEach(i=>{const p=pro(i.p);p.st=Math.max(0,p.st-i.q)});C={};save();render()}
function delV(id){if(confirm('¿Eliminar esta venta?')){S.v=S.v.filter(v=>v.id!=id);save();render()}}
function reset(){if(confirm('Se borrarán todos los datos de ejemplo y tus datos. ¿Continuar?')){S={s:S.s,m:[],p:[],f:[],v:[],o:[]};save();render()}}

async function xls(){
 if(!window.XLSX){alert('Para descargar Excel conéctate a internet una vez');return}
 const W=XLSX.utils,wb=W.book_new(),add=(n,r)=>W.book_append_sheet(wb,W.json_to_sheet(r.length?r:[{}]),n);
 add('Piñatas',S.p.map(p=>{const c=cost(p);return{Piñata:p.n,Tamaño:p.sz,Material:p.mt,Minutos:p.t,Costo:+c.toFixed(2),Precio:p.pr,'Precio sugerido':+sug(p).toFixed(2),Ganancia:+(p.pr-c).toFixed(2),'Margen %':p.pr?+((p.pr-c)/p.pr*100).toFixed(1):0,Existencia:p.st}}));
 add('Materiales',S.m.map(m=>({Material:m.n,Unidad:m.u,'Costo unidad':m.c,Existencia:m.st,Mínimo:m.mn,Valor:+(m.c*m.st).toFixed(2)})));
 add('Costos mensuales',S.f.map(f=>({Concepto:f.n,Tipo:f.ty,'Monto mensual':f.v})));
 add('Pedidos',S.o.map(o=>({Cliente:o.c,WhatsApp:o.tel,Pedido:o.n,Total:o.tot,Anticipo:o.an,Saldo:(o.tot||0)-(o.an||0),Entrega:o.fe,Estado:o.es})));
 add('Ventas',S.v.flatMap(v=>v.i.map(i=>({Fecha:v.d.replace('T',' '),Piñata:i.n,Cantidad:i.q,Precio:i.pr,Costo:+i.c.toFixed(2),Total:i.q*i.pr,Ganancia:+(i.q*(i.pr-i.c)).toFixed(2)}))));
 XLSX.writeFile(wb,'Bbbom-control-'+now().slice(0,10)+'.xlsx')
}
/* ---------- vistas ---------- */
const V={
ini(){
 const mo=now().slice(0,7),vs=S.v.filter(v=>v.d.startsWith(mo)),its=vs.flatMap(v=>v.i);
 const rev=sum(vs.map(v=>v.tot)),cg=sum(its.map(i=>i.c*i.q)),un=sum(its.map(i=>i.q)),fx=sum(S.f.map(f=>f.v));
 let mg,cu;if(rev>0){mg=(rev-cg)/rev;cu=(rev-cg)/un}else{const ps=S.p.filter(p=>p.pr>0);mg=avg(ps.map(p=>(p.pr-cost(p))/p.pr));cu=avg(ps.map(p=>p.pr-cost(p)))}
 const be=mg>0?fx/mg:0,beu=cu>0?Math.ceil(fx/cu):0,ut=rev-cg-fx,pg=fx>0?Math.min(100,Math.max(0,(rev-cg)/fx*100)):0;
 const days=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5-new Date().getTimezoneOffset()*6e4);const k=d.toISOString().slice(0,10);days.push({l:'DLMMJVS'[d.getUTCDay()],t:sum(S.v.filter(v=>v.d.startsWith(k)).map(v=>v.tot))})}
 const mx=Math.max(1,...days.map(d=>d.t));
 const svg=`<svg viewBox="0 0 300 120" width="100%">${days.map((d,i)=>{const h=d.t/mx*80;return`<rect x="${i*43+6}" y="${95-h}" width="32" height="${h}" rx="5" style="fill:var(--pr)"/><text x="${i*43+22}" y="112" text-anchor="middle" font-size="11" style="fill:var(--mu)">${d.l}</text>${d.t?`<text x="${i*43+22}" y="${90-h}" text-anchor="middle" font-size="9" style="fill:var(--tx)">${Math.round(d.t)}</text>`:''}`}).join('')}</svg>`;
 const tp={};its.forEach(i=>tp[i.n]=(tp[i.n]||0)+i.q);const top=Object.entries(tp).sort((a,b)=>b[1]-a[1]).slice(0,5),tm=top[0]?top[0][1]:1;
 const low=S.m.filter(m=>m.st<=m.mn);
 return`<div class="g"><div class="c"><div class="k">Ventas del mes</div><div class="n">${$$(rev)}</div></div>
<div class="c adm"><div class="k">Utilidad neta del mes</div><div class="n ${ut>=0?'ok':'bad'}">${$$(ut)}</div></div>
<div class="c adm"><div class="k">Costos mensuales</div><div class="n">${$$(fx)}</div></div>
<div class="c adm"><div class="k">Margen promedio</div><div class="n">${(mg*100).toFixed(0)}%</div></div></div>
<div class="c adm"><h3>Punto de equilibrio</h3><div class="mu">Necesitas vender <b>${$$(be)}</b> al mes (≈ <b>${beu}</b> piñatas) para cubrir tus costos.</div>
<div class="bar" style="margin:8px 0"><i style="width:${pg}%"></i></div><div class="mu">${pg.toFixed(0)}% cubierto con la ganancia bruta de este mes</div></div>
${pedCard()}<div class="c"><h3>Ventas últimos 7 días</h3>${svg}</div>
<div class="c"><h3>Más vendidas del mes</h3>${top.length?top.map(([n,q])=>`<div class="mu" style="margin-top:6px">${esc(n)} · ${q}</div><div class="bar"><i style="width:${q/tm*100}%;background:var(--ac)"></i></div>`).join(''):'<div class="mu">Aún no hay ventas este mes.</div>'}</div>
${low.length?`<div class="c"><h3 class="bad">⚠️ Material por agotarse</h3>${low.map(m=>`<div>${esc(m.n)}: ${m.st} ${esc(m.u)}</div>`).join('')}</div>`:''}`},
ven(){
 const ids=Object.keys(C),tot=sum(ids.map(id=>C[id]*pro(id).pr));
 return`<h2>Toca una piñata para vender</h2><div class="pg">${S.p.map(p=>`<button onclick="add('${p.id}')">${p.img?`<img src="${p.img}" class="th">`:''}<b>${$$(p.pr)}</b>${esc(p.n)}<span class="mu"><br>${esc(p.sz)} · ${p.st} en stock</span></button>`).join('')||'<div class="mu">Primero agrega piñatas.</div>'}</div>
<div class="c" style="margin-top:12px"><h3>Carrito</h3>${ids.map(id=>{const p=pro(id);return`<div class="row" style="margin:6px 0"><span>${esc(p.n)}</span><span><button class="b2 bs" onclick="sub('${id}')">−</button> ${C[id]} <button class="b2 bs" onclick="add('${id}')">+</button> ${$$(C[id]*p.pr)}</span></div>`}).join('')||'<div class="mu">Vacío</div>'}
<div class="row" style="margin-top:10px"><div class="n">Total ${$$(tot)}</div><button onclick="pay()">Cobrar</button></div></div>`},
pin(){return`<div class="row"><h2>Piñatas</h2><span><button class="b2 bs adm" onclick="demoG()">Ejemplo</button> <button class="bs adm" onclick="addP()">+ Nueva</button></span></div>`+S.p.map(p=>{const c=cost(p),m=p.pr>0?(p.pr-c)/p.pr*100:0;
 return`<div class="c">${p.img?`<img src="${p.img}" class="th" style="height:150px">`:''}<div class="row"><b>${esc(p.n)}</b><span class="mu">${esc(p.sz)} · ${esc(p.mt)}</span></div>
<div class="g mu" style="margin:8px 0"><div class="adm">Costo: <b>${$$(c)}</b></div><div>Precio: <b>${$$(p.pr)}</b></div><div class="adm">Ganancia: <b class="${m>=S.s.mg?'ok':m<25?'bad':''}">${$$(p.pr-c)} (${m.toFixed(0)}%)</b></div><div>Tiempo: <b>${fmtH(p.t)}</b></div><div class="adm">Sugerido: <b>${$$(sug(p))}</b></div><div>Stock: <b class="${p.st<1?'bad':''}">${p.st}</b></div></div>
<div class="row" style="flex-wrap:wrap;justify-content:flex-start"><button class="b2 bs adm" onclick="ficha('${p.id}')">Ficha</button><button class="b2 bs adm" onclick="edP('${p.id}')">Editar</button><button class="b2 bs adm" onclick="dupP('${p.id}')">Duplicar</button><button class="b2 bs adm" onclick="delP('${p.id}')">Eliminar</button><button class="bs" onclick="mkP('${p.id}')">+ Producir</button></div></div>`}).join('')},
mat(){return`<div class="row"><h2>Materiales</h2><button class="bs adm" onclick="addM()">+ Nuevo</button></div>`+S.m.map(m=>`<div class="c" style="${m.st<=m.mn?'border:2px solid var(--bad)':''}"><div class="row"><b>${esc(m.n)}</b><b class="${m.st<=m.mn?'bad':''}">${m.st} ${esc(m.u)}</b></div><div class="mu adm">Costo ${$$(m.c)} por ${esc(m.u)} · valor en bodega ${$$(m.c*m.st)}</div><div class="row" style="margin-top:8px"><button class="b2 bs adm" onclick="edM('${m.id}')">Editar</button><button class="bs" onclick="rpM('${m.id}')">+ Reponer</button></div></div>`).join('')+`<div class="mu adm">Valor total del inventario: <b>${$$(sum(S.m.map(m=>m.c*m.st))+sum(S.p.map(p=>cost(p)*p.st)))}</b> (materiales + piñatas terminadas)</div>`},
cos(){const fx=sum(S.f.filter(f=>f.ty=='Fijo').map(f=>f.v)),op=sum(S.f.filter(f=>f.ty!='Fijo').map(f=>f.v));
 return`<div class="row"><h2>Costos mensuales</h2><button class="bs" onclick="addF()">+ Nuevo</button></div>
<div class="g"><div class="c"><div class="k">Fijos</div><div class="n">${$$(fx)}</div></div><div class="c"><div class="k">Operativos</div><div class="n">${$$(op)}</div></div></div>`+S.f.map(f=>`<div class="c row" onclick="edF('${f.id}')"><span>${esc(f.n)}<div class="mu">${f.ty}</div></span><b>${$$(f.v)}</b></div>`).join('')+`<div class="c"><div class="row"><span>Valor de tu hora: <b>${$$(S.s.h)}</b><br>Margen objetivo: <b>${S.s.mg}%</b></span><button class="b2 bs" onclick="cfg()">Cambiar</button></div></div><div class="c"><h3>Tus datos</h3><div class="mu" id="syn">${syn}</div><button style="margin-top:8px" onclick="xls()">⬇️ Descargar Excel</button>${CFG.url?'<button class="b2 bs" style="margin:8px 0 0 8px" onclick="logout()">Cerrar sesión</button>':''}<div class="mu" style="margin-top:6px">Incluye piñatas, materiales, costos y ventas en hojas separadas.</div></div><button class="b2 bs bd" style="color:#fff" onclick="reset()">Borrar todos los datos</button>`},

 const card=o=>{const sal=(o.tot||0)-(o.an||0),atr=o.fe&&o.fe<hoy&&o.es!='Entregado';
  return`<div class="c"><div class="row"><b>${esc(o.c)}</b><span class="mu">${fd(o.fe)}${atr?' ⚠️ atrasado':''}</span></div><div>${esc(o.n)}</div>
<div class="g mu" style="margin:8px 0"><div>Total: <b>${$$(o.tot)}</b></div><div>Anticipo: <b>${$$(o.an)}</b></div><div>Saldo: <b class="${sal>0?'bad':'ok'}">${$$(sal)}</b></div><div><b>${esc(o.es)}</b></div></div>
${o.es=='Pendiente'&&(o.an||0)<(o.tot||0)/2?`<div class="bad mu">Falta el anticipo del 50% (${$$((o.tot||0)/2)})</div>`:''}
<div class="row" style="justify-content:flex-start;flex-wrap:wrap;margin-top:8px"><button class="b2 bs" onclick="edO('${o.id}')">Editar</button>${o.tel?`<a href="${wa(o.tel)}" target="_blank" rel="noopener" style="color:var(--pr);font-weight:600">WhatsApp ↗</a>`:''}${o.es!='Entregado'?`<button class="bs" onclick="entO('${o.id}')">Entregar y cobrar</button>`:''}</div></div>`};
 return`<div class="row"><h2>Pedidos por encargo</h2><button class="bs" onclick="addO()">+ Nuevo</button></div>`+(pedAct().map(card).join('')||'<div class="mu">No hay pedidos pendientes.</div>')+(ent.length?'<h2>Últimos entregados</h2>'+ent.map(card).join(''):'')},
cot(){if(Date.now()-lastCot>15000){lastCot=Date.now();cotLoad()}const E={nueva:'🆕 Nueva',proceso:'⏳ En proceso',aceptada:'✅ Aceptada',rechazada:'❌ Rechazada'};
 return`<div class="row"><h2>Cotizaciones</h2><button class="b2 bs" onclick="cotLoad()">↻</button></div>`+(COT.map(c=>`<div class="c"><div class="row"><b>${esc(c.nombre)}</b><span class="mu">${new Date(c.created_at).toLocaleDateString('es',{day:'numeric',month:'short'})}</span></div><div class="mu">${esc(c.tipo||'')} · ${esc(c.tamano||'')} · evento: ${esc(c.fecha_evento||'—')}</div><div style="margin:6px 0">${esc(c.detalle||'')}</div><div class="row"><b>${E[c.estado]||esc(c.estado)}</b><a href="${wa(c.telefono)}" target="_blank" rel="noopener" style="color:var(--pr);font-weight:600">WhatsApp ↗</a></div><div class="row" style="margin-top:8px;justify-content:flex-start;flex-wrap:wrap"><button class="b2 bs" onclick="cotEst('${c.id}','proceso')">En proceso</button><button class="b2 bs" onclick="cotEst('${c.id}','aceptada')">Aceptar</button><button class="b2 bs" onclick="cotEst('${c.id}','rechazada')">Rechazar</button><button class="bs" onclick="cot2ped('${c.id}')">Crear pedido</button></div></div>`).join('')||'<div class="mu">Aún no hay cotizaciones.</div>')+`<div class="mu">Enlace para tus clientes: <b>${location.origin}/cotizar.html</b></div>`},
